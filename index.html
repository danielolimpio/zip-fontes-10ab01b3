    <style>
      /* Reset base + estilo mínimo aplicado no primeiro paint (antes do CSS do bundle),
         evitando o flash de conteúdo sem estilo em refresh/atualização. */
      html,body{margin:0;padding:0;background:#ffffff;color:#1E293B;
        font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
        font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
      /* Esconde o HTML pré-renderizado (SEO) para usuários; permanece para crawlers. */
      #seo-prerender{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;}
      /* Fundo neutro do #root até o React montar, evitando flash branco/quebrado. */
      #root:empty{min-height:100vh;background:#ffffff;}
    </style>
